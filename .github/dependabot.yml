# Actions are pinned to commit SHAs in the workflows, and zig-mcp (the Zig
# documentation MCP server of the daily workflow) by its lockfile; this
# proposes the updates so pinning doesn't mean never updating.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /.github/zig-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
