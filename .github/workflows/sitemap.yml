# Keeps the generated files in step with what is published: sitemap.xml, the
# topic line on every archive entry, and the topic index — topics.html and
# one page per tag under tag/ (script/topics.sh).
#
# The daily workflow regenerates them in its own publish job, so this one is
# for the other cases: a drill pushed by hand, and a page whose date was in
# the future when it was published (script/sitemap.sh leaves those out until
# the day arrives, because the middleware 404s them).
#
# Everything here is deterministic and reads only this repository: no Claude,
# no artifacts from other jobs, no untrusted input. That is why this one may
# commit directly.

name: Generated files

on:
  push:
    branches: [main]
    paths:
      - "*/*/archive.html"
      - "*/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].html"
  schedule:
    # 00:05 in Asia/Tokyo, before the daily drill run.
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: namara-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Regenerate the topic index and sitemap.xml, and push if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            ./script/topics.sh
            ./script/sitemap.sh
            # Staged, not `git diff`: topics.html may not be tracked yet on
            # an older main, and an untracked file is invisible to git diff.
            git add -A -- sitemap.xml topics.html tag script/tags.tsv "*/*/archive.html"
            if git diff --cached --quiet; then
              echo "the generated files are already up to date"
              exit 0
            fi
            git commit --quiet -m "index: $(grep -c '<url>' sitemap.xml) URLs"
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt); retrying on the new origin/main"
          done
          exit 1
