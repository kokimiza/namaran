# Publishes one day's Namaran drills (4 languages x READ/WRITE/DEBUG) without
# a human in the loop. See doc/basic-design.md §9.2 for why it is shaped
# like this.
#
#   write    Claude Code writes the pages with the namara-daily skill. It can
#            run any command here, so nothing this job produces is trusted:
#            it only hands on a patch and the verification sources.
#   verify   A fresh runner that Claude never touched. Checks the patch with
#            script/check-patch.sh (from main, not from the patch), applies
#            it, and runs script/verify.sh. Read-only, no secrets.
#   publish  Checks the patch again, applies it on the latest main, re-adds
#            the archive.html lines, regenerates the topic index and
#            sitemap.xml, commits and pushes. The only job with a write
#            token; runs no Claude and no drill code. The generated index
#            files never come from the patch: script/topics.sh rebuilds them
#            here, from main's own copy of the script, out of the metadata
#            the new pages carry (doc/basic-design.md §9.5).
#
# Setup: run `claude setup-token` locally (needs a Claude Pro/Max/Team/
# Enterprise subscription) and add the printed token as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret. Runs count against that
# subscription's usage limits instead of API credits.
#
# Third-party actions are pinned to commit SHAs; .github/dependabot.yml
# proposes updates.

name: Namaran daily

on:
  schedule:
    # 00:10 in Asia/Tokyo (15:10 UTC the day before). GitHub may start
    # scheduled runs late; the date is computed when the run starts.
    - cron: "10 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Drill date, YYYY-MM-DD (empty: today in Asia/Tokyo)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: namara-daily
  cancel-in-progress: false

env:
  # Sonnet is the Claude Code default on Pro. Opus also works on Pro, but
  # writing and verifying 12 drills spends the subscription's usage limit
  # much faster, and a run cut off by the limit publishes nothing.
  CLAUDE_MODEL: claude-sonnet-5

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      date: ${{ steps.plan.outputs.date }}
      combos: ${{ steps.plan.outputs.combos }}
      topics: ${{ steps.plan.outputs.topics }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before Claude, so these outputs can't be influenced by it.
      - name: Decide date, combos and topics
        id: plan
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"
          [[ "$date" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] ||
            { echo "::error::not a YYYY-MM-DD date: $date"; exit 1; }

          # Published pages are never edited (doc/basic-design.md §7.1), so
          # only combos without a page for this date are written.
          combos=""
          for lang in c cpp rust haskell; do
            for type in read write debug; do
              [ -e "$lang/$type/$date.html" ] || combos+="$lang/$type "
            done
          done
          combos="${combos% }"

          topics="$(./script/odai.sh)"
          topic_of() { printf '%s\n' "$topics" | awk -F'\t' -v l="$1" '$1 == l { print $2 }'; }
          verify_dir="$RUNNER_TEMP/namara-verify"
          mkdir -p "$verify_dir"

          {
            echo "date=$date"
            echo "combos=$combos"
            echo "verify_dir=$verify_dir"
            echo "topics<<NAMARA_EOF"
            printf '%s\n' "$topics"
            echo "NAMARA_EOF"
            echo "prompt<<NAMARA_EOF"
            cat <<PROMPT
          /namara-daily 日付 $date で、次の組を作成する: $combos

          お題は script/odai.sh が言語ごとに抽選済み。同じ言語の READ/WRITE/DEBUG は、このお題をそれぞれ別の切り口で扱う:
          - C: $(topic_of c)
          - C++: $(topic_of cpp)
          - Rust: $(topic_of rust)
          - Haskell: $(topic_of haskell)

          これは GitHub Actions 上の非対話実行である(SKILL.md「非対話実行」を参照)。
          - 検証用ソースは $verify_dir/{lang}/{type}/ に置き、次のコマンドが全件通るまで直す:
            ./script/verify.sh $date $verify_dir $combos
          - git 操作はしない。コミットと push は後続のジョブが行う。
          - 上の組の日付ページと archive.html 以外のファイルは変更しない。
          PROMPT
            echo "NAMARA_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Namaran $date"
            echo
            if [ -z "$combos" ]; then
              echo "All 12 pages for $date already exist; nothing to write."
            else
              echo "Combos: \`$combos\`"
              echo
              printf '%s\n' "$topics" | awk -F'\t' '{ printf "- **%s**: %s\n", $1, $2 }'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install toolchains
        if: steps.plan.outputs.combos != ''
        uses: ./.github/actions/toolchains

      - name: Write drills with Claude Code (namara-daily skill)
        id: claude
        if: steps.plan.outputs.combos != ''
        uses: anthropics/claude-code-action@bf38e86e58df9ebf3420326d019f955bb3be64dd # v1
        with:
          # Subscription token from `claude setup-token`. To bill API credits
          # instead, replace this line with:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude needs no GitHub API access here; the read-only job token
          # avoids depending on the Claude GitHub App.
          github_token: ${{ github.token }}
          prompt: ${{ steps.plan.outputs.prompt }}
          claude_args: >-
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 400
            --add-dir ${{ steps.plan.outputs.verify_dir }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
            --disallowedTools "Agent"
          # No subagents: in a non-interactive run the session ends as soon as
          # the main turn does, and subagents still running in the background
          # are killed with it. A run on 2026-09-17 handed all 12 drills to
          # background agents, ended its turn "waiting for them", and left
          # nothing but templates behind.
          # Bash is not narrowed to a command list. Writing a drill means
          # compiling and running code Claude just wrote, so a list never
          # limited what could run; it only made Claude give up when a needed
          # command was denied. Instead, this whole job is treated as
          # untrusted: its token is read-only, and the verify and publish
          # jobs check everything it hands on with code it cannot change.

      # Claude's own messages stay hidden (show_full_output would print every
      # tool result into this public log). Print just enough to see why a run
      # stopped. Workflow commands are switched off around the printed text,
      # since it is written by Claude.
      - name: Summarize the Claude Code run
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          if [ -f "$file" ]; then
            python3 - "$file" <<'PY'
          import json, sys

          text = open(sys.argv[1], encoding="utf-8").read()
          try:
              data = json.loads(text)
              messages = data if isinstance(data, list) else [data]
          except json.JSONDecodeError:
              messages = [json.loads(l) for l in text.splitlines() if l.strip()]

          results = [m for m in messages if isinstance(m, dict) and m.get("type") == "result"]
          if not results:
              print("no result message in the execution file")
              sys.exit(0)
          r = results[-1]
          print(f"subtype={r.get('subtype')} is_error={r.get('is_error')} "
                f"turns={r.get('num_turns')} duration_ms={r.get('duration_ms')}")
          denials = r.get("permission_denials") or []
          print(f"\npermission denials: {len(denials)}")
          for d in denials:
              tool_input = json.dumps(d.get("tool_input"), ensure_ascii=False)
              print(f"  - {d.get('tool_name')}: {tool_input[:300]}")
          print("\nfinal report:")
          print(str(r.get("result") or "(none)")[:4000])
          PY
          else
            echo "no execution file at $file"
          fi
          echo
          echo "changed files:"
          git status --porcelain --untracked-files=all | head -50
          echo
          echo "verification sources:"
          find "$RUNNER_TEMP/namara-verify" -type f 2> /dev/null | sed "s|^$RUNNER_TEMP/namara-verify/||" | sort | head -80
          echo "::$stop::"

      # Packages the result for the next job. Nothing here is a check — this
      # job's environment may have been altered by what ran before — it only
      # has to be convenient when the run went well.
      - name: Package the patch and verification sources
        if: steps.plan.outputs.combos != ''
        env:
          DATE: ${{ steps.plan.outputs.date }}
          COMBOS: ${{ steps.plan.outputs.combos }}
          VERIFY_DIR: ${{ steps.plan.outputs.verify_dir }}
        run: |
          set -euo pipefail
          allowed=() missing=()
          for pair in $COMBOS; do
            allowed+=("$pair/$DATE.html" "$pair/archive.html")
            # One page at a time: `git add -N` with any missing path adds
            # nothing at all, which silently dropped the pages that did exist.
            if [ -f "$pair/$DATE.html" ]; then
              git add -N -- "$pair/$DATE.html"
            else
              missing+=("$pair/$DATE.html")
            fi
          done
          # Fail here with the real reason instead of handing on a patch that
          # check-patch.sh can only reject as "pages missing".
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Claude Code did not write: ${missing[*]}"
            exit 1
          fi
          drop="$RUNNER_TEMP/namara-drop"
          mkdir -p "$drop"
          # Against HEAD, not the index: Claude may have staged its pages, and
          # a plain `git diff` leaves staged changes out entirely.
          git diff HEAD --no-ext-diff --no-color --no-renames -- "${allowed[@]}" > "$drop/drills.patch"
          [ -s "$drop/drills.patch" ] || { echo "::error::Claude Code produced no pages"; exit 1; }
          cp -R "$VERIFY_DIR" "$drop/verify"
          git diff HEAD --stat -- "${allowed[@]}"

      - name: Upload the patch and verification sources
        if: steps.plan.outputs.combos != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: namara-drop
          path: ${{ runner.temp }}/namara-drop
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: write
    if: needs.write.outputs.combos != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the patch and verification sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: namara-drop
          path: ${{ runner.temp }}/namara-drop

      - name: Check the patch
        env:
          DATE: ${{ needs.write.outputs.date }}
          COMBOS: ${{ needs.write.outputs.combos }}
        run: |
          # shellcheck disable=SC2086 # COMBOS is a space-separated list
          ./script/check-patch.sh "$DATE" "$RUNNER_TEMP/namara-drop/drills.patch" $COMBOS

      - name: Apply the patch
        run: git apply --index "$RUNNER_TEMP/namara-drop/drills.patch"

      - name: Install toolchains
        uses: ./.github/actions/toolchains

      # The gate. Claude is told to run this in the write job too, but the
      # result that counts is this one, on a runner Claude never touched.
      - name: Verify
        env:
          DATE: ${{ needs.write.outputs.date }}
          COMBOS: ${{ needs.write.outputs.combos }}
        run: |
          # shellcheck disable=SC2086 # COMBOS is a space-separated list
          ./script/verify.sh "$DATE" "$RUNNER_TEMP/namara-drop/verify" $COMBOS

  publish:
    needs: [write, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download the patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: namara-drop
          path: ${{ runner.temp }}/namara-drop

      # main may have moved on while the drills were being written (e.g. a
      # drill published by hand). The dated pages are new files and apply
      # cleanly on any main; archive.html lines are not taken from the patch
      # but re-inserted by script/content.sh into the current archive.html,
      # which keeps the list newest-first instead of producing a merge
      # conflict. If a dated page already exists on main, applying fails and
      # nothing is published: published pages are never overwritten.
      # check-patch.sh and content.sh run from this checkout of main each
      # time, never from the patch.
      - name: Commit and push
        env:
          DATE: ${{ needs.write.outputs.date }}
          COMBOS: ${{ needs.write.outputs.combos }}
          TOPICS: ${{ needs.write.outputs.topics }}
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/namara-drop/drills.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            # shellcheck disable=SC2086 # COMBOS is a space-separated list
            ./script/check-patch.sh "$DATE" "$patch_file" $COMBOS
            git apply --index --exclude='*/archive.html' "$patch_file"
            # shellcheck disable=SC2086
            ./script/content.sh new "$DATE" $COMBOS
            ./script/topics.sh
            ./script/sitemap.sh
            # -A so a tag page that lost its last drill is staged as a
            # deletion, not left behind.
            git add -A -- */*/archive.html topics.html tag sitemap.xml
            git commit --quiet -F - <<MSG
          ${DATE//-/}

          Written by the namara-daily workflow (Claude Code, namara-daily skill)
          and checked by script/check-patch.sh and script/verify.sh. Topics:
          $(printf '%s\n' "$TOPICS" | sed 's/^/  /')
          MSG
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt); retrying on the new origin/main"
          done
          exit 1
